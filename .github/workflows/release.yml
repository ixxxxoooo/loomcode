# 推送形如 v0.2.0 的 tag 时,在 macOS 上构建 dmg 并创建 GitHub Release(附 appcast.json,供应用内更新读取)。
# 注意:tag 版本号必须与根 Cargo.toml 的 workspace 版本一致。
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # scripts/publish.sh 在本机已创建同名 Release 时整体跳过:不用 --clobber 覆盖,
      # 否则 appcast 与 dmg 可能来自两次不同的构建,sha256 对不上,应用内更新会拒绝安装
      - name: 检查是否已发布
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release 已存在(由 scripts/publish.sh 发布),跳过"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.exists != 'true'
      - name: 打包
        if: steps.check.outputs.exists != 'true'
        run: scripts/package.sh --dmg
      - name: 生成 appcast
        if: steps.check.outputs.exists != 'true'
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          DMG="dist/LoomCode-$VERSION.dmg"
          [ -f "$DMG" ] || { echo "dmg 版本与 tag 不一致"; exit 1; }
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          BUILD=$(git rev-list --count HEAD)
          NOTES=$(git log -n 30 --pretty='%s' | paste -sd ';' -)
          VERSION="$VERSION" BUILD="$BUILD" SHA="$SHA" NOTES="$NOTES" python3 - <<'PY'
          import json, os
          e = os.environ
          feed = {"stable": {"version": e["VERSION"], "build": int(e["BUILD"]),
                  "url": f'https://github.com/{os.environ["REPO"]}/releases/download/{os.environ["TAG"]}/LoomCode-{e["VERSION"]}.dmg',
                  "sha256": e["SHA"], "notes": e["NOTES"]}}
          json.dump(feed, open("dist/appcast.json", "w"), ensure_ascii=False, indent=2)
          PY
      - name: 发布 Release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # publish.sh 先推 tag 再建 Release,开头检查时可能还没建好,构建完再查一次
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已在构建期间由 scripts/publish.sh 发布,跳过上传"
          else
            gh release create "$TAG" --title "LoomCode $TAG" --generate-notes --latest dist/LoomCode-*.dmg dist/appcast.json
          fi
