# 推送到 main 与拉取请求时:零警告编译 + 全工作区测试(需要真实 claude 的测试标了 #[ignore],这里不跑)。
# 工具链版本取自 rust-toolchain.toml(runner 自带 rustup,首次调用 cargo 时自动安装)。
# @author ixxxxoooo
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # 项目约定编译零警告:只作用于本仓库的 crate,依赖照常 cap-lints
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: 工具链
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Git 身份(部分测试会建临时仓库并提交)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: 编译(含测试目标)
        run: cargo build --workspace --all-targets --locked
      - name: 测试
        run: cargo test --workspace --locked
